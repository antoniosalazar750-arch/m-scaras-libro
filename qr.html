<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR para imprimir</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=Inter:wght@400;600&display=swap">
<style>
/* Tarjeta de media carta con el QR de la app, lista para imprimir desde el navegador */
*{box-sizing:border-box}
body{margin:0;background:#e9eef0;font:16px/1.5 Inter,system-ui,sans-serif;color:#0d3542}
.bar{max-width:560px;margin:16px auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:0 16px}
.bar button{appearance:none;border:0;border-radius:12px;background:#0f4c5c;color:#fff;font:600 16px Inter,sans-serif;min-height:48px;padding:0 18px;cursor:pointer}
.bar label{font-size:14px;display:flex;gap:8px;align-items:center}
.card{width:5.5in;height:8.5in;margin:0 auto 24px;background:#f3fafc;display:flex;flex-direction:column;align-items:center;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.top{width:100%;height:2.6in;display:flex;align-items:flex-end;justify-content:center;padding-bottom:.25in}
.top img{max-height:2.1in;max-width:85%;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
h1{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:34pt;line-height:1.05;text-align:center;margin:.25in .4in .08in}
.sub{color:#4d6f79;font-size:12.5pt;text-align:center;margin:0 .4in}
#qr{background:#fff;padding:14px;border-radius:16px;margin:.22in 0 .18in;border:1px solid #cfe6ec}
#qr img,#qr canvas{display:block;width:2.6in!important;height:2.6in!important}
.who{font-weight:600;font-size:13pt;text-align:center}
.url{color:#4d6f79;font-size:10.5pt;margin-top:2px}
@media print{body{background:#fff}.bar{display:none}.card{box-shadow:none;margin:0}@page{size:5.5in 8.5in;margin:0}}
@media(max-width:560px){.card{transform:scale(.62);transform-origin:top center;margin-bottom:-3in}}
</style>
</head>
<body>
<div class="bar"><button id="pr">Imprimir o guardar como PDF</button><label><input type="checkbox" id="fil" checked> QR para presentación (registra que llegaron por el QR)</label></div>
<div class="card">
 <div class="top" id="top"><img id="cover" alt=""></div>
 <h1 id="t"></h1>
 <p class="sub">Escanea y haz el test del libro en 3 minutos</p>
 <div id="qr"></div>
 <div class="who" id="w"></div>
 <div class="url" id="u"></div>
</div>
<script src="contenido.js"></script>
<script src="qrcode.js"></script>
<script>
{
const A=window.APP,C=A.config,B=A.libro,TM=Object.assign({cielo1:"#2f9fbd",cielo3:"#bfe7f0",fuerte:"#0f4c5c"},A.tema||{});
const base="https://"+String(C.sitio||location.host).replace(/^https?:\/\//,"").replace(/\/+$/,"")+"/";
document.getElementById("top").style.background=`linear-gradient(180deg,${TM.cielo1},${TM.cielo3})`;
document.getElementById("t").textContent=A.intro.titulo;
document.getElementById("w").textContent=B.titulo+" · "+B.autor;
document.getElementById("u").textContent=base.replace("https://","").replace(/\/$/,"");
const cv=document.getElementById("cover");cv.src=B.portada||"";cv.alt="Portada de "+B.titulo;cv.onerror=()=>cv.remove();
function draw(){const box=document.getElementById("qr");box.innerHTML="";
 const q=qrcode(0,"M");q.addData(base+(document.getElementById("fil").checked?"?modo=fil":""));q.make();
 const n=q.getModuleCount(),cell=Math.floor(800/n),cv=document.createElement("canvas");cv.width=cv.height=cell*n;
 const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.fillStyle=TM.fuerte;
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect(c*cell,r*cell,cell,cell);
 box.appendChild(cv);}
draw();document.getElementById("fil").onchange=draw;
document.getElementById("pr").onclick=()=>{try{window.print()}catch(e){}};
}
</script>
</body>
</html>
